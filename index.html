<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Actor Connector</title>
  <style>
    body { font-family: sans-serif; padding: 2rem; background: #f0f0f0; }
    input { padding: 0.5rem; margin: 0.5rem; width: 200px; }
    button { padding: 0.5rem 1rem; margin: 0.5rem; }
    #output { white-space: pre-wrap; margin-top: 1rem; background: #fff; padding: 1rem; border-radius: 8px; box-shadow: 0 0 5px rgba(0,0,0,0.1); }
    a { color: #0077cc; text-decoration: none; }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <h1>Actor Connector</h1>

  <input id="actorA" placeholder="Actor A">
  <input id="actorB" placeholder="Actor B">
  <button onclick="connect()">Find Connection</button>

  <div id="output"></div>

  <script src="app.js"></script>
</body>
</html>
